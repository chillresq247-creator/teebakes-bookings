<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeeBakes Booking Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0d1117; color: #e6e6e6; }
    #app { max-width: 1400px; margin: 0 auto; padding: 1rem; }

    .header-bar { background: #161b22; border: 1px solid #f5c518; color: white; padding: 1rem 1.5rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .header-bar h1 { font-size: 1.4rem; color: #f5c518; }
    .header-logo { display: flex; align-items: center; gap: 0.8rem; }
    .button-group { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .btn { padding: 0.4rem 0.9rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .btn-primary   { background: #1d6fa4; color: white; }
    .btn-success   { background: #24963f; color: white; }
    .btn-warning   { background: #f5c518; color: #1a1a1a; }
    .btn-danger    { background: #dc2626; color: white; }
    .btn-info      { background: #0891b2; color: white; }
    .btn-purple    { background: #7c3aed; color: white; }
    .btn-whatsapp  { background: #25D366; color: white; }
    .btn-rollover  { background: #e6a817; color: #1a1a1a; }
    .btn-sm { padding: 0.2rem 0.5rem; font-size: 0.75rem; }

    .summary-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .summary-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem 1.5rem; flex: 1; min-width: 140px; }
    .summary-card h4 { font-size: 0.75rem; color: #888; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }

    .week-nav { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0; gap: 1rem; flex-wrap: wrap; }

    table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; border: 1px solid #30363d; }
    th { background: #1c2128; color: #f5c518; padding: 0.6rem 0.4rem; font-size: 0.85rem; border-bottom: 1px solid #f5c518; }
    td { border: 1px solid #30363d; padding: 0.4rem; vertical-align: top; font-size: 0.85rem; }

    .booking-block { border-radius: 6px; padding: 0.4rem 0.5rem; margin-bottom: 0.3rem; font-size: 0.8rem; }
    .status-confirmed { background: #0d2818; border-left: 3px solid #24963f; }
    .status-pending   { background: #2d2000; border-left: 3px solid #f5c518; }
    .status-deposit   { background: #0d1f3c; border-left: 3px solid #1d6fa4; }
    .status-unpaid    { background: #2d0a0a; border-left: 3px solid #dc2626; }
    .status-completed { background: #1a1a2e; border-left: 3px solid #7c3aed; }

    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 1rem; }
    .month-day-header { background: #1c2128; color: #f5c518; text-align: center; padding: 0.4rem; font-size: 0.8rem; border-radius: 4px; }
    .month-day { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.4rem; min-height: 80px; font-size: 0.8rem; }
    .other-month { opacity: 0.3; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #161b22; border: 1px solid #f5c518; border-radius: 10px; padding: 1.5rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; }
    .modal-content h3 { color: #f5c518; margin-bottom: 0.3rem; }
    .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 0.5rem; border: 1px solid #30363d; border-radius: 6px; font-size: 0.9rem; background: #0d1117; color: #e6e6e6; }
    .modal-content label { font-size: 0.8rem; color: #888; margin-bottom: 0.1rem; display: block; }

    .form-row { display: flex; gap: 0.6rem; }
    .form-col { flex: 1; }

    .password-screen { max-width: 340px; margin: 6rem auto; background: #161b22; border: 1px solid #f5c518; padding: 2rem; border-radius: 10px; text-align: center; display: flex; flex-direction: column; gap: 0.8rem; align-items: center; }
    .password-screen h2 { color: #f5c518; }
    .password-screen input { padding: 0.6rem; border: 1px solid #30363d; border-radius: 6px; font-size: 1rem; width: 100%; background: #0d1117; color: #e6e6e6; text-align: center; }

    .wa-client-row { padding: 0.6rem; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 0.4rem; display: flex; justify-content: space-between; align-items: center; background: #0d1117; }

    .badge { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 0.2rem; }
    .badge-birthday  { background: #ff69b4; color: white; }
    .badge-wedding   { background: #fff8e7; color: #333; }
    .badge-corporate { background: #1d6fa4; color: white; }
    .badge-market    { background: #24963f; color: white; }
    .badge-pub       { background: #8b4513; color: white; }
    .badge-popup     { background: #7c3aed; color: white; }

    .venue-free     { color: #24963f; font-size: 0.75rem; }
    .venue-fee      { color: #dc2626; font-size: 0.75rem; }
    .venue-popup    { color: #888; font-size: 0.75rem; }

    h3 { margin: 1rem 0 0.5rem; color: #f5c518; }
    .section-table th { background: #1c2128; }
  </style>
</head>
<body>
<div id="app"></div>
<script>

var PASSWORD = 'Tee2026';
var ROLL_AHEAD_MONTHS = 3;

var EVENT_TYPES = ['birthday','wedding','corporate','market','pub','popup'];
var EVENT_LABELS = { birthday:'Birthday', wedding:'Wedding', corporate:'Corporate', market:'Market', pub:'Pub', popup:'Pop-up' };
var EVENT_BADGE  = { birthday:'badge-birthday', wedding:'badge-wedding', corporate:'badge-corporate', market:'badge-market', pub:'badge-pub', popup:'badge-popup' };
var VENUE_TYPES  = { free:'Free Venue', fee:'Venue Fee', popup:'No Cost Pop-up' };
var STATUS_TYPES = ['pending','deposit','confirmed','unpaid','completed'];
var STATUS_LABELS= { pending:'Pending', deposit:'Deposit Paid', confirmed:'Fully Confirmed', unpaid:'Unpaid', completed:'Completed' };
var STATUS_CLS   = { pending:'status-pending', deposit:'status-deposit', confirmed:'status-confirmed', unpaid:'status-unpaid', completed:'status-completed' };

var BLANK_BOOKING  = { customerId:'', date:'', nextDate:'', type:'popup', venueCost:'free', venueFee:0, orderDetails:'', price:0, deposit:0, depositPaid:false, status:'pending', notes:'', repeat:'none', reminderFlag:false };
var BLANK_CUSTOMER = { name:'', phone:'', email:'', notes:'' };

function toYMD(dt) {
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function parseLocal(d) {
  var p = d.split('-');
  return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
}
function formatDate(d) { return parseLocal(d).toLocaleDateString('en-GB'); }
function addDays(d, days) { var dt = parseLocal(d); dt.setDate(dt.getDate()+days); return toYMD(dt); }
function addMonthsStr(d, m) { var dt = parseLocal(d); dt.setMonth(dt.getMonth()+m); return toYMD(dt); }
function newId() { return String(Date.now()) + '-' + String(Math.floor(Math.random()*1000000)); }
function cloneObj(obj) { return JSON.parse(JSON.stringify(obj)); }
function todayMonday() { var d = new Date(); d.setDate(d.getDate()-d.getDay()+1); return toYMD(d); }

function getMonthDays(y, m) {
  var first = new Date(y, m, 1);
  var start = new Date(first);
  start.setDate(1 - first.getDay() + (first.getDay()===0 ? -6 : 1));
  var days = [];
  for (var i = 0; i < 42; i++) {
    var d = new Date(start); d.setDate(start.getDate()+i);
    days.push({ date: toYMD(d), current: d.getMonth()===m });
  }
  return days;
}

function loadItems(key) {
  var items = JSON.parse(localStorage.getItem(key) || '[]');
  return items.map(function(x) { x.id = String(x.id); return x; });
}

var state = {
  authenticated: false,
  inputPass: '',
  customers: loadItems('tb_customers'),
  bookings:  loadItems('tb_bookings'),
  view: 'week',
  weekStart: todayMonday(),
  month: { y: new Date().getFullYear(), m: new Date().getMonth() },
  showBookingForm:  false,
  showCustomerForm: false,
  showWhatsAppList: false,
  editingBooking:  null,
  editingCustomer: null,
  bookingForm:  cloneObj(BLANK_BOOKING),
  customerForm: cloneObj(BLANK_CUSTOMER)
};

function saveState() {
  localStorage.setItem('tb_customers', JSON.stringify(state.customers));
  localStorage.setItem('tb_bookings',  JSON.stringify(state.bookings));
  render();
}

function checkPassword() {
  if (state.inputPass === PASSWORD) {
    state.authenticated = true; state.inputPass = ''; saveState();
  } else { alert('Wrong password.'); }
}

function exportData() {
  var json = JSON.stringify({ customers: state.customers, bookings: state.bookings }, null, 2);
  var a = document.createElement('a');
  try { a.href = URL.createObjectURL(new Blob([json],{type:'application/json'})); }
  catch(e) { a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json); }
  a.download = 'teebakes-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function importData(e) {
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (confirm('Replace all current data with this backup?')) {
        state.customers = data.customers.map(function(c){ c.id=String(c.id); return c; });
        state.bookings  = data.bookings.map(function(b){ b.id=String(b.id); return b; });
        saveState();
      }
    } catch(err) { alert('Invalid backup file.'); }
  };
  reader.readAsText(e.target.files[0]);
}

function wipeAllData() {
  if (confirm('Delete ALL customers and bookings?')) {
    if (confirm('Last chance — permanently delete everything?')) {
      state.customers = []; state.bookings = []; saveState();
    }
  }
}

function rollOver() {
  var today = toYMD(new Date());
  var endDate = addMonthsStr(today, ROLL_AHEAD_MONTHS);
  var newBookings = [];
  state.bookings.forEach(function(b) {
    if (!b.nextDate || b.nextDate <= today) return;
    var exists = state.bookings.some(function(x) {
      return x.customerId===b.customerId && x.date===b.nextDate && x.id!==b.id;
    });
    var queued = newBookings.some(function(x) {
      return x.customerId===b.customerId && x.date===b.nextDate;
    });
    if (!exists && !queued && b.nextDate <= endDate) {
      newBookings.push(Object.assign({}, b, {
        id: newId(), date: b.nextDate, nextDate: '', status: 'pending',
        depositPaid: false, paid: false
      }));
    }
  });
  if (newBookings.length === 0) { alert('No upcoming dates to roll over.'); return; }
  state.bookings = state.bookings.concat(newBookings);
  alert('Added ' + newBookings.length + ' new booking(s)!');
  saveState();
}

function sendWhatsAppBooking(bookingId) {
  var b = null;
  for (var i = 0; i < state.bookings.length; i++) { if (state.bookings[i].id===bookingId) { b=state.bookings[i]; break; } }
  if (!b) return;
  var c = null;
  for (var i = 0; i < state.customers.length; i++) { if (state.customers[i].id===b.customerId) { c=state.customers[i]; break; } }
  if (!c) return;
  var phone = c.phone.replace(/[^0-9]/g,'');
  if (phone.charAt(0)==='0') phone='44'+phone.slice(1);
  var msg = 'Hi ' + c.name + ', this is to confirm your TeeBakes ' + (EVENT_LABELS[b.type]||b.type) + ' booking on ' + formatDate(b.date) + '. Order: ' + b.orderDetails + '. Total: £' + Number(b.price).toFixed(2) + '. Thank you! - TeeBakes';
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
}

function sendWhatsAppCustomer(customerId) {
  var c = null;
  for (var i = 0; i < state.customers.length; i++) { if (state.customers[i].id===customerId) { c=state.customers[i]; break; } }
  if (!c) return;
  var latest = null;
  state.bookings.forEach(function(b){ if (b.customerId===customerId && (!latest||b.date>latest.date)) latest=b; });
  var phone = c.phone.replace(/[^0-9]/g,'');
  if (phone.charAt(0)==='0') phone='44'+phone.slice(1);
  var msg = 'Hi ' + c.name + ', this is to confirm your TeeBakes booking';
  if (latest) msg += ' on ' + formatDate(latest.date) + '. Order: ' + latest.orderDetails;
  msg += '. Please reply to confirm. Thank you! - TeeBakes';
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  state.showWhatsAppList = false; saveState();
}

function saveCustomer() {
  var f = state.customerForm;
  if (!f.name.trim()||!f.phone.trim()) { alert('Name and Phone are required.'); return; }
  if (state.editingCustomer) {
    var eid = state.editingCustomer.id;
    state.customers = state.customers.map(function(c){ return c.id===eid ? Object.assign({},f,{id:eid}) : c; });
  } else { state.customers.push(Object.assign({},f,{id:newId()})); }
  state.showCustomerForm=false; state.editingCustomer=null; state.customerForm=cloneObj(BLANK_CUSTOMER);
  saveState();
}

function editCustomer(id) {
  for (var i=0;i<state.customers.length;i++) {
    if (state.customers[i].id===id) { state.editingCustomer=state.customers[i]; state.customerForm=cloneObj(state.customers[i]); state.showCustomerForm=true; saveState(); return; }
  }
}

function deleteCustomer(id) {
  var name=''; for (var i=0;i<state.customers.length;i++) { if(state.customers[i].id===id){name=state.customers[i].name;break;} }
  var has=state.bookings.some(function(b){return b.customerId===id;});
  if (confirm('Delete '+name+'?'+(has?' Also deletes their bookings.':''))) {
    state.customers=state.customers.filter(function(c){return c.id!==id;});
    if(has) state.bookings=state.bookings.filter(function(b){return b.customerId!==id;});
    saveState();
  }
}

function saveBooking() {
  var f = state.bookingForm;
  if (!f.customerId||!f.date||!f.orderDetails||!f.price) { alert('Customer, Date, Order Details and Price are required.'); return; }
  var price=Number(f.price);
  if (isNaN(price)||price<0) { alert('Enter a valid price.'); return; }
  if (state.editingBooking) {
    var eid=state.editingBooking.id;
    state.bookings=state.bookings.map(function(b){ return b.id===eid?Object.assign({},f,{price:price,id:eid}):b; });
  } else {
    state.bookings.push(Object.assign({},f,{price:price,id:newId()}));
  }
  state.showBookingForm=false; state.editingBooking=null; state.bookingForm=cloneObj(BLANK_BOOKING);
  saveState();
}

function editBooking(id) {
  for (var i=0;i<state.bookings.length;i++) {
    if (state.bookings[i].id===id) { state.editingBooking=state.bookings[i]; state.bookingForm=cloneObj(state.bookings[i]); state.showBookingForm=true; saveState(); return; }
  }
}

function updateStatus(id, val) {
  state.bookings=state.bookings.map(function(b){ return b.id===id?Object.assign({},b,{status:val}):b; });
  saveState();
}

function toggleReminder(id) {
  state.bookings=state.bookings.map(function(b){ return b.id===id?Object.assign({},b,{reminderFlag:!b.reminderFlag}):b; });
  saveState();
}

function deleteBooking(id) {
  if (confirm('Delete this booking?')) {
    state.bookings=state.bookings.filter(function(b){return b.id!==id;}); saveState();
  }
}

function collectAndSaveCustomer() {
  state.customerForm.name  = document.getElementById('cf_name').value;
  state.customerForm.phone = document.getElementById('cf_phone').value;
  state.customerForm.email = document.getElementById('cf_email').value;
  state.customerForm.notes = document.getElementById('cf_notes').value;
  saveCustomer();
}

function collectAndSaveBooking() {
  state.bookingForm.customerId   = document.getElementById('bf_customer').value;
  state.bookingForm.date         = document.getElementById('bf_date').value;
  state.bookingForm.nextDate     = document.getElementById('bf_nextdate').value;
  state.bookingForm.type         = document.getElementById('bf_type').value;
  state.bookingForm.venueCost    = document.getElementById('bf_venuecost').value;
  state.bookingForm.venueFee     = Number(document.getElementById('bf_venuefee').value)||0;
  state.bookingForm.orderDetails = document.getElementById('bf_order').value;
  state.bookingForm.price        = document.getElementById('bf_price').value;
  state.bookingForm.deposit      = Number(document.getElementById('bf_deposit').value)||0;
  state.bookingForm.status       = document.getElementById('bf_status').value;
  state.bookingForm.notes        = document.getElementById('bf_notes').value;
  saveBooking();
}

function bookingBlockHTML(b, compact) {
  var c=null; for(var i=0;i<state.customers.length;i++){if(state.customers[i].id===b.customerId){c=state.customers[i];break;}}
  if(!c) return '';
  var cls = STATUS_CLS[b.status]||'status-pending';
  var id = b.id;
  var typeLabel = EVENT_LABELS[b.type]||b.type;
  var badgeCls  = EVENT_BADGE[b.type]||'badge-popup';
  if (compact) return '<div class="booking-block ' + cls + '">' + c.name + ' <span class="badge ' + badgeCls + '">' + typeLabel + '</span></div>';

  var venueInfo = '';
  if (b.venueCost==='fee') venueInfo = '<span class="venue-fee">Venue fee: £' + Number(b.venueFee||0).toFixed(2) + '</span>';
  else if (b.venueCost==='free') venueInfo = '<span class="venue-free">Free venue</span>';
  else venueInfo = '<span class="venue-popup">No cost pop-up</span>';

  var profitLine = '';
  if (b.venueCost==='fee' && b.venueFee) {
    var profit = Number(b.price) - Number(b.venueFee||0);
    profitLine = '<br><small style="color:#f5c518">Profit after fee: £' + profit.toFixed(2) + '</small>';
  }

  return '<div class="booking-block ' + cls + '">' +
    (b.reminderFlag ? '<span style="color:#f5c518">⚑ </span>' : '') +
    '<strong>' + c.name + '</strong> <span class="badge ' + badgeCls + '">' + typeLabel + '</span><br>' +
    '<small>' + b.orderDetails + '</small><br>' +
    '£' + Number(b.price).toFixed(2) +
    (b.deposit>0 ? ' <small>(deposit: £'+Number(b.deposit).toFixed(2)+')</small>' : '') +
    '<br>' + venueInfo + profitLine + '<br>' +
    (b.nextDate ? '<small style="color:#888">Next: ' + formatDate(b.nextDate) + '</small><br>' : '') +
    '<select onchange="updateStatus(\''+id+'\',this.value)" style="font-size:0.7rem;padding:0.15rem;margin:0.2rem 0;border-radius:4px;border:1px solid #444;background:#0d1117;color:#e6e6e6">' +
    STATUS_TYPES.map(function(s){ return '<option value="'+s+'"'+(b.status===s?' selected':'')+'>'+STATUS_LABELS[s]+'</option>'; }).join('') +
    '</select><br>' +
    '<button class="btn btn-warning btn-sm" onclick="editBooking(\''+id+'\')">Edit</button> ' +
    '<button class="btn btn-danger btn-sm" onclick="deleteBooking(\''+id+'\')">Delete</button> ' +
    '<button class="btn btn-whatsapp btn-sm" onclick="sendWhatsAppBooking(\''+id+'\')">WhatsApp</button> ' +
    '<button class="btn btn-sm" style="background:'+(b.reminderFlag?'#f5c518':'#333')+';color:'+(b.reminderFlag?'#000':'#fff')+'" onclick="toggleReminder(\''+id+'\')">⚑</button>' +
    '</div>';
}

function render() {
  var app = document.getElementById('app');

  if (!state.authenticated) {

    weekDays.forEach(function(d) {
      var lbl = parseLocal(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      var dayBookings = state.bookings.filter(function(b){return b.date===d;});
      var isToday = d===toYMD(new Date());
      html += '<tr><td style="background:#1c2128;font-weight:bold;white-space:nowrap;width:110px;color:'+(isToday?'#f5c518':'#aaa')+';padding:0.5rem;border-right:2px solid #f5c518">'+lbl+'</td>';
      html += '<td style="padding:0.4rem">';
      if(dayBookings.length===0) html += '<span style="color:#444;font-size:0.8rem">No bookings</span>';
      else dayBookings.forEach(function(b){html+=bookingBlockHTML(b,false);});
      html += '</td></tr>';
    });
    html += '</tbody></table></div>';
  } else {
    var monthDays=getMonthDays(state.month.y,state.month.m);
    var ml=new Date(state.month.y,state.month.m,1).toLocaleString('en-GB',{month:'long',year:'numeric'});
    html += '<div class="week-nav">' +
      '<button class="btn btn-primary" onclick="state.month.m--;if(state.month.m<0){state.month.m=11;state.month.y--;}saveState()">◀ Prev</button>' +
      '<strong>'+ml+'</strong>' +
      '<button class="btn btn-primary" onclick="state.month.m++;if(state.month.m>11){state.month.m=0;state.month.y++;}saveState()">Next ▶</button>' +
      '</div><div class="month-grid">';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){html+='<div class="month-day-header">'+d+'</div>';});
    monthDays.forEach(function(day){
      html+='<div class="month-day'+(day.current?'':' other-month')+'">';
      html+='<div style="font-weight:bold;margin-bottom:0.2rem;color:#f5c518">'+parseLocal(day.date).getDate()+'</div>';
      var cnt=0;
      state.bookings.forEach(function(b){if(b.date===day.date&&cnt<2){html+=bookingBlockHTML(b,true);cnt++;}});
      html+='</div>';
    });
    html+='</div>';
  }

  // Reminders section
  var flagged = state.bookings.filter(function(b){return b.reminderFlag;});
  if (flagged.length>0) {
    html += '<h3>⚑ Reminders</h3><table><thead><tr><th>Customer</th><th>Date</th><th>Order</th><th>Action</th></tr></thead><tbody>';
    flagged.forEach(function(b){
      var c=null; for(var i=0;i<state.customers.length;i++){if(state.customers[i].id===b.customerId){c=state.customers[i];break;}}
      if(!c) return;
      html+='<tr><td>'+c.name+'</td><td>'+formatDate(b.date)+'</td><td>'+b.orderDetails+'</td>' +
        '<td><button class="btn btn-sm btn-warning" onclick="toggleReminder(\''+b.id+'\')">Clear</button></td></tr>';
    });
    html+='</tbody></table>';
  }

  // Customers table
  html += '<h3>All Customers</h3>';
  if(state.customers.length===0) {
    html+='<p style="color:#888">No customers yet — click "+ Customer" to get started.</p>';
  } else {
    html+='<table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Bookings</th><th>Edit</th><th>Delete</th></tr></thead><tbody>';
    state.customers.forEach(function(c){
      var cnt=state.bookings.filter(function(b){return b.customerId===c.id;}).length;
      html+='<tr><td>'+c.name+'</td><td>'+c.phone+'</td><td>'+(c.email||'-')+'</td><td>'+cnt+'</td>' +
        '<td><button class="btn btn-warning btn-sm" onclick="editCustomer(\''+c.id+'\')">Edit</button></td>' +
        '<td><button class="btn btn-danger btn-sm" onclick="deleteCustomer(\''+c.id+'\')">Delete</button></td></tr>';
    });
    html+='</tbody></table>';
  }

  // WhatsApp modal
  if(state.showWhatsAppList) {
    html+='<div class="modal"><div class="modal-content"><h3>WhatsApp Customer</h3>';
    if(state.customers.length===0) html+='<p>No customers yet.</p>';
    else state.customers.forEach(function(c){
      var latest=null;
      state.bookings.forEach(function(b){if(b.customerId===c.id&&(!latest||b.date>latest.date))latest=b;});
      var info=latest?formatDate(latest.date)+' - '+latest.orderDetails.slice(0,25):'No bookings';
      html+='<div class="wa-client-row"><div><strong>'+c.name+'</strong><br><small style="color:#888">'+info+'</small></div>' +
        '<button class="btn btn-whatsapp btn-sm" onclick="sendWhatsAppCustomer(\''+c.id+'\')">Send</button></div>';
    });
    html+='<div style="text-align:right;margin-top:0.8rem"><button class="btn" onclick="state.showWhatsAppList=false;saveState()">Close</button></div></div></div>';
  }

  // Customer form modal
  if(state.showCustomerForm) {
    var f=state.customerForm;
    html+='<div class="modal"><div class="modal-content">' +
      '<h3>'+(state.editingCustomer?'Edit Customer':'Add New Customer')+'</h3>' +
      '<input type="text"  id="cf_name"  value="'+f.name+'"  placeholder="Full Name *">' +
      '<input type="tel"   id="cf_phone" value="'+f.phone+'" placeholder="Phone Number *">' +
      '<input type="email" id="cf_email" value="'+f.email+'" placeholder="Email (optional)">' +
      '<textarea id="cf_notes" rows="2" placeholder="Notes">'+f.notes+'</textarea>' +
      '<div style="text-align:right;margin-top:0.8rem">' +
      '<button class="btn" onclick="state.showCustomerForm=false;saveState()">Cancel</button> ' +
      '<button class="btn btn-warning" onclick="collectAndSaveCustomer()">Save Customer</button>' +
      '</div></div></div>';
  }

  // Booking form modal
  if(state.showBookingForm) {
    var bf=state.bookingForm;
    var custOpts='<option value="">-- Select Customer --</option>';
    state.customers.forEach(function(c){custOpts+='<option value="'+c.id+'"'+(c.id===bf.customerId?' selected':'')+'>'+c.name+'</option>';});
    var typeOpts='';
    EVENT_TYPES.forEach(function(t){typeOpts+='<option value="'+t+'"'+(t===bf.type?' selected':'')+'>'+EVENT_LABELS[t]+'</option>';});
    var statusOpts='';
    STATUS_TYPES.forEach(function(s){statusOpts+='<option value="'+s+'"'+(s===bf.status?' selected':'')+'>'+STATUS_LABELS[s]+'</option>';});
    html+='<div class="modal"><div class="modal-content">' +
      '<h3>'+(state.editingBooking?'Edit Booking':'Add New Booking')+'</h3>' +
      '<label>Customer</label><select id="bf_customer">'+custOpts+'</select>' +
      '<div class="form-row">' +
      '<div class="form-col"><label>Date</label><input type="date" id="bf_date" value="'+bf.date+'"></div>' +
      '<div class="form-col"><label>Next Date (optional)</label><input type="date" id="bf_nextdate" value="'+(bf.nextDate||'')+'"></div>' +
      '</div>' +
      '<div class="form-row">' +
      '<div class="form-col"><label>Event Type</label><select id="bf_type">'+typeOpts+'</select></div>' +
      '<div class="form-col"><label>Status</label><select id="bf_status">'+statusOpts+'</select></div>' +
      '</div>' +
      '<label>Venue Cost</label>' +
      '<select id="bf_venuecost" onchange="document.getElementById(\'venuefee_row\').style.display=this.value===\'fee\'?\'flex\':\'none\'">' +
      '<option value="free"'+(bf.venueCost==='free'?' selected':'')+'>Free Venue</option>' +
      '<option value="fee"'+(bf.venueCost==='fee'?' selected':'')+'>I Pay a Venue Fee</option>' +
      '<option value="popup"'+(bf.venueCost==='popup'?' selected':'')+'>No Cost Pop-up</option>' +
      '</select>' +
      '<div id="venuefee_row" class="form-row" style="display:'+(bf.venueCost==='fee'?'flex':'none')+'">' +
      '<div class="form-col"><label>Venue Fee £</label><input type="number" id="bf_venuefee" step="0.01" min="0" value="'+(bf.venueFee||0)+'"></div>' +
      '</div>' +
      '<label>Order Details</label><textarea id="bf_order" rows="3" placeholder="e.g. 50 loaded cookies, 2 dozen donuts, cookie pie x2...">'+bf.orderDetails+'</textarea>' +
      '<div class="form-row">' +
      '<div class="form-col"><label>Total Price £</label><input type="number" id="bf_price" step="0.01" min="0" value="'+bf.price+'"></div>' +
      '<div class="form-col"><label>Deposit £</label><input type="number" id="bf_deposit" step="0.01" min="0" value="'+(bf.deposit||0)+'"></div>' +
      '</div>' +
      '<label>Notes / Special Requests</label><textarea id="bf_notes" rows="2" placeholder="Dietary requirements, delivery info, etc">'+bf.notes+'</textarea>' +
      '<div style="text-align:right;margin-top:0.8rem">' +
      '<button class="btn" onclick="state.showBookingForm=false;saveState()">Cancel</button> ' +
      '<button class="btn btn-success" onclick="collectAndSaveBooking()">Save Booking</button>' +
      '</div></div></div>';
  }

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
